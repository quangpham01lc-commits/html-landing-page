<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Landing Page</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background:#f4f4f4;
}

header{
background:#222;
color:white;
padding:20px;
text-align:center;
}

.hero{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:60px 20px;
text-align:center;
background:white;
}

.hero img{
width:250px;
border-radius:10px;
margin-bottom:20px;
}

.hero h1{
font-size:32px;
margin-bottom:10px;
}

.hero p{
color:#555;
max-width:500px;
}

.btn{
margin-top:20px;
padding:12px 25px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

.btn:hover{
background:#0056b3;
}

.features{
display:flex;
justify-content:center;
gap:30px;
padding:50px;
flex-wrap:wrap;
}

.feature{
background:white;
padding:20px;
width:220px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
text-align:center;
}

footer{
text-align:center;
padding:20px;
background:#222;
color:white;
}

</style>

</head>

<body>

<header>
<h2>Fresh Lemon Water</h2>
</header>

<section class="hero">

<img src="https://images.unsplash.com/photo-1524594154908-edd95b3f6a6b" alt="lemon water">

<h1>Stay Hydrated Every Day</h1>

<p>Drinking lemon water helps boost hydration and supports a healthy lifestyle.</p>

<button class="btn">Order Now</button>

</section>

<section class="features">

<div class="feature">
<h3>Healthy</h3>
<p>Natural ingredients with refreshing taste.</p>
</div>

<div class="feature">
<h3>Simple</h3>
<p>Easy to prepare and perfect for daily hydration.</p>
</div>

<div class="feature">
<h3>Refreshing</h3>
<p>A great drink for hot days.</p>
</div>

</section>

<footer>
<p>© 2026 Lemon Water Brand</p>
</footer>

</body>
</html>
